ão por locale.</tspan></text></g><g><path d="M53 720 Q200 713 360 719 T587 722 Q597 728 594 740 L593 979 Q588 991 576 990 L65 991 Q52 987 53 971 Z" fill="#fffefa" fill-opacity=".93" stroke="#bd8d22" stroke-width="2.2"/><path d="M73 772 Q275 765 520 773" fill="none" stroke="#bd8d22" stroke-width="5" stroke-linecap="round" opacity=".48"/><text x="73" y="764" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="22" font-weight="800" fill="#bd8d22">FUNCIONAMENTO</text><text font-family="'Segoe UI',Arial,sans-serif" font-size="14.5" fill="#303844"><tspan x="72" y="793">• DateTimeFormatter localizado para formatação e parsing de</tspan><tspan x="72" y="812">datas/horas.</tspan><tspan x="72" y="835">• Diferenças entre padrões de formatação, símbolos e</tspan><tspan x="72" y="854">representações regionais.</tspan></text></g><g><path d="M1213 80 Q1360 73 1520 79 T1747 82 Q1757 88 1754 100 L1753 339 Q1748 351 1736 350 L1225 351 Q1212 347 1213 331 Z" fill="#fffefa" fill-opacity=".93" stroke="#ca625c" stroke-width="2.2"/><path d="M1233 132 Q1435 125 1680 133" fill="none" stroke="#ca625c" stroke-width="5" stroke-linecap="round" opacity=".48"/><text x="1233" y="124" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="22" font-weight="800" fill="#ca625c">REGRAS</text><text font-family="'Segoe UI',Arial,sans-serif" font-size="14.5" fill="#303844"><tspan x="1232" y="153">• Locale explícito para resultados previsíveis; não depender</tspan><tspan x="1232" y="172">da configuração padrão da máquina.</tspan></text></g><g><path d="M1213 400 Q1360 393 1520 399 T1747 402 Q1757 408 1754 420 L1753 659 Q1748 671 1736 670 L1225 671 Q1212 667 1213 651 Z" fill="#fffefa" fill-opacity=".93" stroke="#d47a31" stroke-width="2.2"/><path d="M1233 452 Q1435 445 1680 453" fill="none" stroke="#d47a31" stroke-width="5" stroke-linecap="round" opacity=".48"/><text x="1233" y="444" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="22" font-weight="800" fill="#d47a31">CUIDADOS<