<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200" role="img" aria-labelledby="t d"><title id="t">Streams e expressões lambda em Java</title><desc id="d">Mapa mental sobre interfaces funcionais, lambdas, method references, streams, collectors e Optional.</desc><defs><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#dce5ec"/></pattern><style>.h{font:800 27px 'Segoe Print','Comic Sans MS',cursive;fill:#222832}.p{font:16px 'Segoe UI',Arial,sans-serif;fill:#303844}.s{font:700 11px 'Segoe UI',Arial,sans-serif;letter-spacing:1.4px;fill:#627181}.b{fill:#fffefa;fill-opacity:.9;stroke-width:2.5;stroke-linejoin:round}.a{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:.82}</style><marker id="m1" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L9 5.5L1 10" fill="none" stroke="#3678c7" stroke-width="2.4"/></marker><marker id="m2" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L9 5.5L1 10" fill="none" stroke="#328c68" stroke-width="2.4"/></marker><marker id="m3" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L9 5.5L1 10" fill="none" stroke="#bd8d22" stroke-width="2.4"/></marker><marker id="m4" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L9 5.5L1 10" fill="none" stroke="#ca625c" stroke-width="2.4"/></marker><marker id="m5" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L9 5.5L1 10" fill="none" stroke="#d47a31" stroke-width="2.4"/></marker><marker id="m6" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L9 5.5L1 10" fill="none" stroke="#805eaa" stroke-width="2.4"/></marker></defs><rect width="1800" height="1200" fill="#fffefa"/><rect width="1800" height="1200" fill="url(#g)" opacity=".68"/><text x="900" y="38" text-anchor="middle" class="s">JAVA SE 17 · FOLHA DE REVISÃO</text><g aria-hidden="true"><path class="a" stroke="#3678c7" marker-end="url(#m1)" d="M700 465Q595 355 480 245"/><path class="a" stroke="#328c68" marker-end="url(#m2)" d="M820 425Q795 310 810 210"/><path class="a" stroke="#bd8d22" marker-end="url(#m3)" d="M1090 465Q1200 345 1325 245"/><path class="a" stroke="#ca625c" marker-end="url(#m4)" d="M660 555Q540 550 455 550"/><path class="a" stroke="#d47a31" marker-end="url(#m5)" d="M1140 555Q1250 555 1340 570"/><path class="a" stroke="#805eaa" marker-end="url(#m6)" d="M700 650Q590 760 485 850"/><path class="a" stroke="#3678c7" marker-end="url(#m1)" d="M1100 650Q1210 760 1320 850"/><path class="a" stroke="#328c68" marker-end="url(#m2)" d="M900 700V890"/></g>
<g><rect x="50" y="75" width="430" height="300" rx="22" class="b" stroke="#3678c7"/><path d="M75 127Q240 120 430 128" stroke="#78a8e0" stroke-width="6" opacity=".55"/><text x="78" y="119" class="h" fill="#2866aa">Conceito</text><text x="78" y="163" class="p"><tspan x="78">Programação funcional: funções como</tspan><tspan x="78" dy="25">valores e dados em pipelines.</tspan><tspan x="78" dy="35">• interface funcional define o contrato</tspan><tspan x="78" dy="28">• lambda implementa comportamento</tspan><tspan x="78" dy="28">• stream transforma e agrega elementos</tspan></text></g>
<g><rect x="625" y="65" width="500" height="320" rx="22" class="b" stroke="#328c68"/><path d="M650 117Q825 110 1080 118" stroke="#70bb96" stroke-width="6" opacity=".55"/><text x="653" y="109" class="h" fill="#287451">Elementos</text><text x="655" y="153" class="p"><tspan x="655">Predicate · Function · Consumer · Supplier</tspan><tspan x="655" dy="27">Lambda: parâmetros → expressão ou bloco</tspan><tspan x="655" dy="27">Method references: estático · instância ·</tspan><tspan x="655" dy="23">instância arbitrária · construtor</tspan><tspan x="655" dy="29">Stream: filter · map · flatMap · distinct ·</tspan><tspan x="655" dy="23">sorted · limit · skip · peek</tspan><tspan x="655" dy="29">Optional · Collectors · groupingBy · toMap</tspan></text></g>
<g><rect x="1320" y="75" width="430" height="300" rx="22" class="b" stroke="#bd8d22"/><path d="M1345 127Q1510 120 1700 128" stroke="#e6c45a" stroke-width="6" opacity=".62"/><text x="1348" y="119" class="h" fill="#987119">Funcionamento</text><text x="1350" y="162" class="p"><tspan x="1350">Intermediárias são lazy.</tspan><tspan x="1350" dy="27">Terminal executa o pipeline: collect, count,</tspan><tspan x="1350" dy="23">reduce, forEach, min, max.</tspan><tspan x="1350" dy="30">Curto-circuito: anyMatch, allMatch,</tspan><tspan x="1350" dy="23">noneMatch, findFirst, findAny.</tspan><tspan x="1350" dy="30">Optional: of, ofNullable, empty, map,</tspan><tspan x="1350" dy="23">flatMap, orElse, orElseGet.</tspan></text></g>
<g><rect x="48" y="430" width="425" height="280" rx="22" class="b" stroke="#ca625c"/><path d="M73 480Q230 473 420 481" stroke="#e4958e" stroke-width="6" opacity=".58"/><text x="76" y="472" class="h" fill="#ad4e49">Exemplo</text><text x="78" y="515" class="p"><tspan x="78">nomes.stream()</tspan><tspan x="78" dy="27">  .filter(n -&gt; n.length() &gt; 3)</tspan><tspan x="78" dy="27">  .map(String::toUpperCase)</tspan><tspan x="78" dy="27">  .toList()</tspan><tspan x="78" dy="39">Optional.ofNullable(valor)</tspan><tspan x="78" dy="27">  .orElseGet(this::padrao)</tspan></text></g>
<g><rect x="1340" y="430" width="410" height="280" rx="22" class="b" stroke="#d47a31"/><path d="M1365 480Q1525 473 1705 481" stroke="#edaa6a" stroke-width="6" opacity=".6"/><text x="1368" y="472" class="h" fill="#b66724">Aplicações</text><text x="1370" y="517" class="p"><tspan x="1370">• filtrar e transformar dados</tspan><tspan x="1370" dy="28">• reduzir ou coletar resultados</tspan><tspan x="1370" dy="28">• agrupar com groupingBy</tspan><tspan x="1370" dy="28">• particionar com partitioningBy</tspan><tspan x="1370" dy="28">• compor funções e predicados</tspan><tspan x="1370" dy="28">• representar ausência com Optional</tspan></text></g>
<g><rect x="50" y="790" width="430" height="300" rx="22" class="b" stroke="#805eaa"/><path d="M75 842Q240 835 430 843" stroke="#ad92d0" stroke-width="6" opacity=".58"/><text x="78" y="834" class="h" fill="#704b9b">Cuidados</text><text x="80" y="879" class="p"><tspan x="80">• Captura local precisa ser efetivamente final.</tspan><tspan x="80" dy="28">• Stream consumido não pode ser reutilizado.</tspan><tspan x="80" dy="28">• peek não substitui operação terminal.</tspan><tspan x="80" dy="28">• Evite efeitos colaterais compartilhados.</tspan><tspan x="80" dy="28">• orElse avalia agora; orElseGet sob demanda.</tspan><tspan x="80" dy="28">• Optional não substitui toda referência ou campo.</tspan></text></g>
<g><rect x="1320" y="790" width="430" height="300" rx="22" class="b" stroke="#3678c7"/><path d="M1345 842Q1510 835 1700 843" stroke="#78a8e0" stroke-width="6" opacity=".58"/><text x="1348" y="834" class="h" fill="#2866aa">Resumo</text><text x="1350" y="879" class="p"><tspan x="1350">Fonte → operações intermediárias → terminal</tspan><tspan x="1350" dy="30">Lambda adapta comportamento ao tipo funcional.</tspan><tspan x="1350" dy="30">Collectors reduz, agrupa e particiona.</tspan><tspan x="1350" dy="30">Optional modela possível ausência.</tspan><tspan x="1350" dy="37">Intermediária ≠ execução; terminal executa.</tspan></text></g>
<g><rect x="625" y="885" width="500" height="205" rx="22" class="b" stroke="#328c68"/><path d="M650 937Q825 930 1080 938" stroke="#70bb96" stroke-width="6" opacity=".58"/><text x="653" y="929" class="h" fill="#287451">Vantagens</text><text x="655" y="970" class="p"><tspan x="655">Composição declarativa de operações.</tspan><tspan x="655" dy="27">Interfaces funcionais conectam funções à API.</tspan><tspan x="655" dy="27">Pipelines separam transformação e resultado.</tspan><tspan x="655" dy="27">Collectors concentram estratégias de coleta.</tspan></text></g>
<path d="M690 465C720 438 775 449 807 425C840 401 870 423 899 408C933 391 970 422 1003 419C1040 416 1075 443 1097 474C1118 504 1105 538 1120 568C1138 602 1104 646 1071 662C1038 678 1005 660 972 681C939 701 900 677 869 691C835 706 801 677 765 676C727 675 696 645 685 612C673 579 690 547 675 518C660 492 674 480 690 465Z" fill="#c4edf2" stroke="#8fd6e0" stroke-width="2"/><text x="900" y="488" text-anchor="middle" class="s">TEMA CENTRAL</text><text x="900" y="544" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="38" font-weight="900" fill="#20242a">STREAMS</text><text x="900" y="588" text-anchor="middle" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="38" font-weight="900" fill="#20242a">E LAMBDAS</text><path d="M745 611Q900 623 1055 610M760 619Q901 628 1040 617" fill="none" stroke="#242831" stroke-width="4" stroke-linecap="round"/><text x="900" y="650" text-anchor="middle" class="p">Java SE 17</text><text x="900" y="1165" text-anchor="middle" class="s">TRANSFORME · COMPONHA · COLETE</text></svg>
